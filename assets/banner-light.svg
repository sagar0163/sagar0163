<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A66C2"/>
      <stop offset="100%" stop-color="#4dabf7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- agent-graph motif: nodes + connecting edges, right side -->
  <g transform="translate(850,0)" opacity="0.9">
    <circle cx="120" cy="80" r="95" fill="url(#glow)"/>
    <g stroke="#d0d7de" stroke-width="1.5" fill="none">
      <line x1="60" y1="60" x2="150" y2="40"/>
      <line x1="60" y1="60" x2="80" y2="150"/>
      <line x1="150" y1="40" x2="230" y2="90"/>
      <line x1="150" y1="40" x2="200" y2="180"/>
      <line x1="80" y1="150" x2="200" y2="180"/>
      <line x1="80" y1="150" x2="30" y2="220"/>
      <line x1="200" y1="180" x2="270" y2="230"/>
      <line x1="230" y1="90" x2="200" y2="180"/>
      <line x1="150" y1="40" x2="30" y2="220"/>
    </g>
    <g fill="#0A66C2">
      <circle cx="60" cy="60" r="4.5"/>
      <circle cx="150" cy="40" r="6" fill="#0A66C2" stroke="#4dabf7" stroke-width="1.5"/>
      <circle cx="230" cy="90" r="4.5"/>
      <circle cx="80" cy="150" r="4.5"/>
      <circle cx="200" cy="180" r="6" fill="#0A66C2" stroke="#4dabf7" stroke-width="1.5"/>
      <circle cx="30" cy="220" r="4.5"/>
      <circle cx="270" cy="230" r="4.5"/>
    </g>
  </g>

  <!-- accent rule -->
  <rect x="80" y="90" width="5" height="120" fill="url(#accent)" rx="2.5"/>

  <!-- text block -->
  <text x="112" y="140" font-family="'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="700" fill="#1f2328">Sagar Jadhav</text>
  <text x="112" y="175" font-family="'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="19" fill="#57606a">Software Engineer — Production AI Agent Systems &amp; API Gateways</text>

  <!-- role chips -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.5" font-weight="600">
    <rect x="112" y="196" width="106" height="28" rx="14" fill="#eef2f6" stroke="#d0d7de"/>
    <text x="165" y="214" fill="#0A66C2" text-anchor="middle">LangGraph</text>

    <rect x="228" y="196" width="88" height="28" rx="14" fill="#eef2f6" stroke="#d0d7de"/>
    <text x="272" y="214" fill="#0A66C2" text-anchor="middle">Node.js</text>

    <rect x="326" y="196" width="82" height="28" rx="14" fill="#eef2f6" stroke="#d0d7de"/>
    <text x="367" y="214" fill="#0A66C2" text-anchor="middle">Python</text>

    <rect x="418" y="196" width="118" height="28" rx="14" fill="#eef2f6" stroke="#d0d7de"/>
    <text x="477" y="214" fill="#0A66C2" text-anchor="middle">Kubernetes</text>

    <rect x="546" y="196" width="98" height="28" rx="14" fill="#eef2f6" stroke="#d0d7de"/>
    <text x="595" y="214" fill="#0A66C2" text-anchor="middle">TypeScript</text>
  </g>

  <text x="112" y="255" font-family="'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#6e7781">Mumbai, India · Cateina Technologies</text>
</svg>
